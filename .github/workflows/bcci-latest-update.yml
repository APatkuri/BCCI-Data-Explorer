name: BCCI Latest Data Update

on:
  schedule:
    # Mondays and Thursdays at 09:30 UTC. The update is incremental, so an extra
    # run costs little and a single failed run is caught up within days.
    - cron: '30 9 * * 1,4'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max matches to fetch this run (0 = no cap)'
        required: false
        default: '40'
      seasons:
        description: 'Seasons to refresh, space separated (blank = current)'
        required: false
        default: ''

# The job commits its results, so it needs write access to the repo. Declared
# explicitly rather than relying on the repo-wide default, which an org policy
# can flip to read-only without warning.
permissions:
  contents: write

# A second run starting while one is mid-push would race on the same files.
concurrency:
  group: bcci-latest-update
  cancel-in-progress: false

jobs:
  update:
    # Pinned rather than ubuntu-latest, which moves to a new image under us
    # (it began switching to Ubuntu 26 on 2026-10-19).
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        working-directory: BCCI_Latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: BCCI_Latest/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Run weekly update
        id: update
        run: |
          python weekly_update.py \
            --limit "${{ github.event.inputs.limit || '40' }}" \
            ${{ github.event.inputs.seasons && format('--season {0}', github.event.inputs.seasons) || '' }}

      # Runs even when the update step fails, so a partial run still keeps what
      # it fetched. Safe because the scripts only ever add to or replace rows in
      # data/ -- a failed fetch leaves existing files untouched. The job still
      # ends red, because the update step's failure is what decides that.
      - name: Commit changes
        if: ${{ !cancelled() && steps.update.outcome != 'skipped' }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "BCCI Latest data update"

          # Rebase onto whatever landed while the scrape was running, then push.
          # Retried because a concurrent push can still win the race.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
