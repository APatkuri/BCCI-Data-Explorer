name: BCCI Latest Data Update

on:
  schedule:
    - cron: '30 9 * * 1' # Every Monday at 09:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max matches to fetch this run (0 = no cap)'
        required: false
        default: '40'
      seasons:
        description: 'Seasons to refresh, space separated (blank = current)'
        required: false
        default: ''

# The job commits its results, so it needs write access to the repo. Declared
# explicitly rather than relying on the repo-wide default, which an org policy
# can flip to read-only without warning.
permissions:
  contents: write

# A second run starting while one is mid-push would race on the same files.
concurrency:
  group: bcci-latest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: BCCI_Latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: BCCI_Latest/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly update
        run: |
          python weekly_update.py \
            --limit "${{ github.event.inputs.limit || '40' }}" \
            ${{ github.event.inputs.seasons && format('--season {0}', github.event.inputs.seasons) || '' }}

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "BCCI Latest data update"

          # Rebase onto whatever landed while the scrape was running, then push.
          # Retried because a concurrent push can still win the race.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
